name: DWGViewer
options:
  bundleIdPrefix: com.jgh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Y78CLWCDMD
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DWGViewer:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # 화면(HTML/JS/WASM)은 ../web 폴더를 그대로 앱에 넣는다
      - path: ../web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: DWGViewer
        PRODUCT_BUNDLE_IDENTIFIER: com.jgh.DWGViewer
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
